{% load static %}
<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Error (500) | CoreCraftr</title>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('corecraftr-theme') || 'dark';
        var effective = pref === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : (pref === 'light' ? 'light' : 'dark');
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(effective);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/app.min.css' %}">
</head>
<body class="min-h-screen flex items-center justify-center bg-canvas text-ink p-4">
  <div class="cc-card max-w-md w-full p-8 text-center">
    <div class="text-xs font-bold uppercase tracking-wider text-accent-ink mb-2">CoreCraftr &mdash; Build Smarter. Build Better.</div>
    <h1 class="text-2xl font-bold text-ink mb-2">Something went wrong (500)</h1>
    <p class="text-sm text-muted mb-6">
      An unexpected error occurred while processing your request. Please try again in a moment.
    </p>
    <a href="/" class="cc-btn cc-btn-primary cc-btn-sm">Return to CoreCraftr Home</a>
  </div>
</body>
</html>
