{% extends 'base.html' %}

{% block title %}Reset Password | CoreCraftr{% endblock %}

{% block content %}
<div class="mx-auto max-w-md py-6 sm:py-10">
  <div class="cc-card p-6 sm:p-8 space-y-5">
    <div>
      <h1 class="text-xl font-extrabold text-ink mb-1">Reset Your Password</h1>
      <p class="text-xs text-muted leading-relaxed">Enter your account email address and we will send password reset instructions.</p>
    </div>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="cc-label" for="id_reset_email">Email Address</label>
        <input id="id_reset_email" type="email" name="email" class="cc-input" required placeholder="you@example.com">
      </div>
      <button type="submit" class="cc-btn cc-btn-primary cc-btn-lg w-full">Send Reset Link</button>
    </form>
    <div class="border-t border-border pt-3 text-center text-xs">
      <a href="{% url 'login' %}" class="text-tech-ink hover:underline">Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
