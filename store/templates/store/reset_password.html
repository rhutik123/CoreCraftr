{% extends 'base.html' %}

{% block title %}Reset Password | HardwareHub{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-5">
    <div class="hh-card p-4">
      <h4 class="fw-bold mb-2">Reset Your Password</h4>
      <p class="small text-muted mb-3">Enter your account email address and we will send password reset instructions.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email Address</label>
          <input type="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
      </form>
      <div class="text-center small mt-3">
        <a href="{% url 'login' %}">Back to Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
