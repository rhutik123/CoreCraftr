{% extends 'base.html' %}

{% block title %}Set New Password | CoreCraftr{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-5">
    <div class="hh-card p-4">
      <h4 class="fw-bold mb-3">Choose a New Password</h4>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
