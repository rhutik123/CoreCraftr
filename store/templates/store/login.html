{% extends 'base.html' %}

{% block title %}Sign In | HardwareHub{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-5 col-lg-4">
    <div class="hh-card p-4">
      <h3 class="fw-bold text-center mb-3">Sign In</h3>
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" required autofocus placeholder="Enter username">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
      </form>
      <div class="text-center small">
        <div class="mb-1">New to HardwareHub? <a href="{% url 'register' %}">Create an account</a></div>
        <div><a href="{% url 'reset_password' %}" class="text-muted">Forgot your password?</a></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
