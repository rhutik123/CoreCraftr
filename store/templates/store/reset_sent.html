{% extends 'base.html' %}

{% block title %}Reset Email Sent | CoreCraftr{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6">
    <div class="hh-card p-4 text-center">
      <i class="bi bi-envelope-check fs-1 text-success mb-2 d-block"></i>
      <h4 class="fw-bold">Check Your Email</h4>
      <p class="text-muted small">If an account matches the email address provided, a password reset link has been sent (or logged to console in local development mode).</p>
      <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Return to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
