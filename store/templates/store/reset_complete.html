{% extends 'base.html' %}

{% block title %}Password Reset Complete | HardwareHub{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6">
    <div class="hh-card p-4 text-center">
      <i class="bi bi-shield-check fs-1 text-success mb-2 d-block"></i>
      <h4 class="fw-bold">Password Updated Successfully</h4>
      <p class="text-muted small">Your password has been reset. You can now sign in with your new credentials.</p>
      <a href="{% url 'login' %}" class="btn btn-primary">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
